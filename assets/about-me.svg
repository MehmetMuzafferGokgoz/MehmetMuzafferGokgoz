<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff41"/>
      <stop offset="1" stop-color="#00ffff"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#03140a"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00ff41" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <style>
    .mono { font-family: Consolas, 'Courier New', 'DejaVu Sans Mono', monospace; }
    .title { font-size: 22px; font-weight: 700; fill: #00ff41; letter-spacing: 4px; }
    .label { font-size: 15px; fill: #00ffff; }
    .value { font-size: 15px; fill: #c9d1d9; }
    .sep { fill: #00ff41; }
    .row { opacity: 0; animation: fadeIn .6s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: translateX(0); } }
    .beam { stroke-dasharray: 110 390; animation: run 5s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -500; } }
    .pulse { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { stroke-opacity: .25; } 50% { stroke-opacity: .6; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .scan { animation: scan 6s linear infinite; }
    @keyframes scan { from { transform: translateY(0); } to { transform: translateY(340px); } }
  </style>

  <!-- arka plan -->
  <rect x="10" y="10" width="880" height="360" rx="16" fill="url(#bg)"/>
  <rect x="10" y="10" width="880" height="360" rx="16" fill="url(#grid)"/>
  <rect class="scan" x="12" y="14" width="876" height="2" fill="#00ff41" opacity="0.08"/>

  <!-- çerçeve: sabit soluk kenar + dönen neon ışık -->
  <rect class="pulse" x="10" y="10" width="880" height="360" rx="16" fill="none" stroke="#00ff41" stroke-width="2"/>
  <rect class="beam" x="10" y="10" width="880" height="360" rx="16" fill="none" stroke="url(#beam)" stroke-width="4" stroke-linecap="round" pathLength="1000" filter="url(#glow)"/>

  <!-- köşe işaretleri -->
  <g stroke="#00ffff" stroke-width="3" fill="none" filter="url(#glow)">
    <path d="M28 52V28H52"/>
    <path d="M848 28H872V52"/>
    <path d="M28 328V352H52"/>
    <path d="M872 328V352H848"/>
  </g>

  <!-- başlık -->
  <g class="mono">
    <text x="60" y="66" class="title">✦ ABOUT ME<tspan class="cursor" fill="#00ffff">_</tspan></text>
    <line x1="60" y1="84" x2="840" y2="84" stroke="#00ff41" stroke-opacity="0.35" stroke-dasharray="4 6"/>

    <g class="row" style="animation-delay:.2s">
      <text x="60" y="122" class="label">name</text><text x="180" y="122" class="sep">:</text>
      <text x="200" y="122" class="value">Mehmet Muzaffer Gökgöz</text>
    </g>
    <g class="row" style="animation-delay:.5s">
      <text x="60" y="156" class="label">education</text><text x="180" y="156" class="sep">:</text>
      <text x="200" y="156" class="value">B.Sc. Software Engineering (3rd year)</text>
      <text x="200" y="178" class="value" fill-opacity="0.7">Istanbul Health and Technology University</text>
      <text x="200" y="204" class="value">Associate Degree, Computer Programming</text>
      <text x="200" y="226" class="value" fill-opacity="0.7">Tekirdağ Namık Kemal University</text>
    </g>
    <g class="row" style="animation-delay:.8s">
      <text x="60" y="262" class="label">focus</text><text x="180" y="262" class="sep">:</text>
      <text x="200" y="262" class="value">Computer Vision · Deep Learning · Embedded Systems · Robotics Perception</text>
    </g>
    <g class="row" style="animation-delay:1.1s">
      <text x="60" y="294" class="label">interests</text><text x="180" y="294" class="sep">:</text>
      <text x="200" y="294" class="value">Defense Technologies · Low-level Systems · Mobile Apps</text>
    </g>
    <g class="row" style="animation-delay:1.4s">
      <text x="60" y="326" class="label">research</text><text x="180" y="326" class="sep">:</text>
      <text x="200" y="326" class="value">Driver drowsiness detection with deep learning on NVIDIA Jetson Nano</text>
    </g>
  </g>
</svg>
